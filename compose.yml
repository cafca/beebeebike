services:
  db:
    image: postgis/postgis:16-3.4
    container_name: beebeebike-db
    environment:
      POSTGRES_DB: beebeebike
      POSTGRES_USER: beebeebike
      POSTGRES_PASSWORD: beebeebike
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  graphhopper:
    image: israelhikingmap/graphhopper:latest@sha256:845087f96492ef6c97a16a690b1dccf7608a2c56e7e6e433b2c34d1521b0ab19
    container_name: beebeebike-graphhopper
    entrypoint:
      - "./graphhopper.sh"
      - "-c"
      - "/config/config.yml"
      - "-o"
      - "/data/graphhopper-cache"
    ports:
      - "8989:8989"
    volumes:
      - ./backend/graphhopper_config.yml:/config/config.yml:ro
      - ./backend/custom_models:/custom_models:ro
      - ./data/osm/berlin/berlin.osm.pbf:/data/berlin.osm.pbf:ro
      - ./data/osm/berlin/graphhopper:/data/graphhopper-cache
    environment:
      JAVA_OPTS: "-Xmx2g -Xms512m"
    restart: unless-stopped

  tiles:
    image: versatiles/versatiles-frontend:v5.4.0-alpine@sha256:efda5c400b1091f6d308c9e5a4613301b56ab7e821081819f740e99c9b079e79
    container_name: beebeebike-tiles
    ports:
      - "8080:8080"
    volumes:
      - ./data/tiles/berlin.versatiles:/tiles/berlin.versatiles:ro
    # The image entrypoint already runs `versatiles serve --static ...`;
    # only the tile source is passed here.
    command: ["[osm]/tiles/berlin.versatiles"]
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: beebeebike-backend
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://beebeebike:beebeebike@db:5432/beebeebike
      GRAPHHOPPER_URL: http://graphhopper:8989
      PHOTON_URL: https://photon.komoot.io
      LISTEN_ADDR: 0.0.0.0:3000
      STATIC_DIR: /app/web/dist
    depends_on:
      - db
      - graphhopper
    restart: unless-stopped

volumes:
  pgdata:
